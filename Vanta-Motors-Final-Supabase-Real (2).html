-- Cole este SQL no SQL Editor do Supabase. Nenhum dado fictício será inserido.

-- Extensões
create extension if not exists "uuid-ossp";

-- PROFILES
create table if not exists profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text unique not null,
  role text not null check (role in ('admin','vendedor')),
  active boolean default true,
  created_at timestamp default now()
);

-- VEHICLES - TEXTO LIVRE, SEM FK OBRIGATÓRIA PARA MARCA/MODELO
create table if not exists vehicles (
  id uuid primary key default uuid_generate_v4(),
  tipo text not null, -- Carro, Moto, Outro - texto livre
  condicao text, -- Novo, Usado, Seminovo - livre
  marca text not null, -- livre
  modelo text not null, -- livre
  versao text, -- livre
  ano_fab smallint,
  ano_modelo smallint,
  km integer,
  preco numeric,
  categoria text, -- livre
  combustivel text, -- livre
  cambio text, -- livre
  cor text, -- livre
  portas smallint,
  motor text, -- livre, ex: 2.0 Turbo, 160cc
  cidade text,
  estado text,
  descricao text,
  opcionais text[] default '{}', -- array livre
  anunciante_nome text,
  anunciante_phone text,
  link_original text,
  observacoes_internas text,
  status text default 'rascunho' check (status in ('rascunho','publicado','reservado','vendido','arquivado')),
  responsavel_id uuid references profiles(id),
  created_at timestamp default now(),
  updated_at timestamp default now()
);
create index if not exists idx_vehicles_status on vehicles(status);
create index if not exists idx_vehicles_marca on vehicles(marca);
create index if not exists idx_vehicles_tipo on vehicles(tipo);

-- VEHICLE_PHOTOS
create table if not exists vehicle_photos (
  id uuid primary key default uuid_generate_v4(),
  vehicle_id uuid references vehicles(id) on delete cascade not null,
  image_url text not null,
  display_order int default 0,
  is_main boolean default false,
  created_at timestamp default now()
);

-- VEHICLE_INSPECTIONS (opcional)
create table if not exists vehicle_inspections (
  vehicle_id uuid primary key references vehicles(id) on delete cascade,
  pintura smallint check (pintura between 0 and 100),
  mecanica smallint,
  pneus smallint,
  interior smallint,
  documentacao smallint,
  sem_sinistro boolean,
  unico_dono boolean,
  revisoes_em_dia boolean,
  ipva_pago boolean
);

-- LEADS
create table if not exists leads (
  id uuid primary key default uuid_generate_v4(),
  nome text not null,
  whatsapp text not null,
  email text,
  vehicle_id uuid references vehicles(id) on delete set null,
  mensagem text,
  origem text,
  stage text default 'Novo',
  consent_lgpd boolean default false,
  created_at timestamp default now()
);

-- LEAD STAGE HISTORY
create table if not exists lead_stage_history (
  id uuid primary key default uuid_generate_v4(),
  lead_id uuid references leads(id) on delete cascade,
  from_stage text,
  to_stage text,
  changed_by uuid references profiles(id),
  created_at timestamp default now()
);

-- FAVORITES
create table if not exists favorites (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references profiles(id) on delete cascade,
  vehicle_id uuid references vehicles(id) on delete cascade,
  created_at timestamp default now(),
  unique(user_id, vehicle_id)
);

-- VEHICLE_VIEWS
create table if not exists vehicle_views (
  id uuid primary key default uuid_generate_v4(),
  vehicle_id uuid references vehicles(id) on delete cascade,
  user_id uuid references profiles(id) on delete set null,
  ip text,
  created_at timestamp default now()
);

-- PARTNERS
create table if not exists partners (
  id uuid primary key default uuid_generate_v4(),
  nome text not null,
  tipo text,
  contato text,
  cidade text,
  observacoes text,
  status text default 'ativo',
  created_at timestamp default now()
);

-- PROSPECT_LISTINGS
create table if not exists prospect_listings (
  id uuid primary key default uuid_generate_v4(),
  link text,
  marca text,
  modelo text,
  ano smallint,
  preco numeric,
  anunciante text,
  contato text,
  cidade text,
  observacoes text,
  status text default 'Novo' check (status in ('Novo','Contatado','Aguardando','Autorizado','Convertido','Descartado')),
  created_at timestamp default now()
);

-- SETTINGS
create table if not exists settings (
  key text primary key,
  value text,
  updated_at timestamp default now()
);

-- SEARCH_HISTORY, SIMULATIONS, ORDERS
create table if not exists search_history (id uuid primary key default uuid_generate_v4(), user_id uuid, query text, created_at timestamp default now());
create table if not exists simulations (id uuid primary key default uuid_generate_v4(), vehicle_id uuid, user_id uuid, entrada numeric, parcelas int, taxa numeric, created_at timestamp default now());
create table if not exists orders (id uuid primary key default uuid_generate_v4(), vehicle_id uuid references vehicles(id), buyer_name text, buyer_whatsapp text, status text default 'pendente', created_at timestamp default now());

-- STORAGE BUCKET
-- No Supabase Dashboard: Storage > New bucket > vehicle-images (public)
-- Policies: permitir insert/select/delete apenas para authenticated com role adequada, e select público para leitura

-- RLS ATIVAR
alter table profiles enable row level security;
alter table vehicles enable row level security;
alter table vehicle_photos enable row level security;
alter table leads enable row level security;
alter table favorites enable row level security;
alter table vehicle_views enable row level security;
alter table partners enable row level security;
alter table prospect_listings enable row level security;
alter table settings enable row level security;

-- POLÍTICAS RLS
-- VISITANTES: só veículos publicados
create policy "public can view published vehicles" on vehicles for select using (status = 'publicado');
create policy "public can view photos of published vehicles" on vehicle_photos for select using (exists (select 1 from vehicles v where v.id = vehicle_photos.vehicle_id and v.status='publicado'));

-- AUTHENTICATED: admin full, vendedor own
-- (Simplificado, ajuste com função is_admin)
create policy "admin full access vehicles" on vehicles for all using (exists (select 1 from profiles where profiles.id = auth.uid() and role='admin' and active=true));
create policy "admin manage photos" on vehicle_photos for all using (exists (select 1 from profiles where profiles.id = auth.uid() and role in ('admin','vendedor') and active=true));

-- Leads: público pode inserir, admin lê
create policy "public can insert leads" on leads for insert with check (true);
create policy "admin can view leads" on leads for select using (exists (select 1 from profiles where profiles.id=auth.uid() and role='admin'));

-- Favorites: usuário dono
create policy "users manage own favorites" on favorites for all using (user_id = auth.uid());

-- Settings: público lê, admin escreve
create policy "public read settings" on settings for select using (true);
create policy "admin write settings" on settings for all using (exists (select 1 from profiles where profiles.id=auth.uid() and role='admin'));
