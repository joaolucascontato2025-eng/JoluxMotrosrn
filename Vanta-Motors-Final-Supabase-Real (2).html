<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VANTA MOTORS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* CSS START */
:root{--gold:#D6B56D;--gold2:#C9A65E;--ink:#101010;--line:#EEEEEE;--soft:#6B6B6B;--bg2:#FAFAFA}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo b{font-family:Montserrat,sans-serif}
h1{font-size:28px;line-height:1.1}h2{font-size:20px}h3{font-size:15px;margin-bottom:6px}
a{color:inherit;text-decoration:none}
.w{max-width:1280px;margin:auto;padding:24px}
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding-block:0}
.logo{display:flex;align-items:center;gap:12px;padding:4px 10px;margin-left:-10px;border-radius:999px;cursor:pointer}
.logo:hover{background:var(--bg2)}
.logo img{height:36px;width:auto;max-width:140px;object-fit:contain}
.logo span{line-height:1}.logo b{display:block;font-size:14px;letter-spacing:.12em}
.logo small{font:500 10px Montserrat;letter-spacing:.2em;opacity:.7}
.vmark{width:36px;height:36px;background:var(--ink);color:var(--gold);display:grid;place-items:center;border-radius:8px;font:800 18px Montserrat;letter-spacing:-1px}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav a{font-size:13px;color:var(--soft)}nav a.on{color:var(--ink);font-weight:600}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;font:600 12px Inter,sans-serif;cursor:pointer}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.5}
.gold{background:var(--gold);border-color:var(--gold)}.gold:hover{background:var(--gold2)}
.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.dark:hover{background:#1A1A1A}
input,select,textarea{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:999px;font:13px Inter,sans-serif;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus,.btn:focus-visible{border-color:var(--gold);box-shadow:0 0 0 2px #D6B56D55}
textarea{border-radius:16px;resize:vertical}
select.sm{width:auto;padding:5px 10px;font-size:11px}
label{display:block;font-size:11px;color:var(--soft);margin:10px 0 4px}
.card{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;margin-bottom:20px}
.pad{padding:20px}.mut{color:var(--soft);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid .card{margin:0}
.ph{aspect-ratio:4/2.8;background:var(--bg2);display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:#9A9A9A;text-align:center;border-bottom:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}.ph.big{aspect-ratio:16/10}
.empty{text-align:center;padding:60px 24px;background:var(--bg2)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:48px}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.hero h1 span{font-weight:500}
.search{display:flex;gap:10px;margin:28px 0 14px;flex-wrap:wrap}.search input{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cat{display:grid;grid-template-columns:280px 1fr;gap:28px}
.cat aside{align-self:start;position:sticky;top:84px}
.two,.fg{display:grid;gap:12px;grid-template-columns:1fr 1fr}.fg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.det{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;margin-top:20px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.pt{position:relative}.pt button{position:absolute;top:2px;background:#fff;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer}
.pt button:nth-of-type(1){left:2px}.pt button:nth-of-type(2){right:2px}
.spec{display:flex;justify-content:space-between;border-bottom:1px solid #F5F5F5;padding:8px 0;gap:12px}
.tag{display:inline-block;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:3px 12px;font-size:11px;margin:0 6px 6px 0}
.item{padding:12px 0;border-bottom:1px solid #F5F5F5}.item:last-child{border:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.price{font:700 28px Montserrat,sans-serif;margin:10px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--soft);margin:12px 0}.chk input{width:auto;margin-top:2px}
footer{background:var(--ink);color:#fff;margin-top:40px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;color:#9A9A9A}
footer a{color:#fff;margin-right:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;z-index:100;display:none;max-width:90vw}
#toast.show{display:block}#toast.err{background:#9B2C2C}
@media(max-width:860px){.hero,.cat,.det{grid-template-columns:1fr}.cat aside{position:static}.w{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* CSS END */
</style>
</head>
<body>
<!-- HTML START -->
<div id="hdr"></div>
<main id="app"></main>
<footer id="ftr"></footer>
<div id="toast" role="status"></div>
<!-- HTML END -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// JS START
const SB_URL='https://xwnxbafcwdijuzlutrzg.supabase.co';
const SB_KEY='sb_publishable_yOPkmQUDMUO7H58BxBg4CA_RXYfZ-dp';
const sb=supabase.createClient(SB_URL,SB_KEY);
const MAIL_PADRAO='vantamotorsrn@gmail.com';
const EMPTY='Não temos veículos disponíveis no momento. Novos anúncios serão adicionados em breve.';
const ST=['rascunho','publicado','reservado','vendido','arquivado'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>n?'R$ '+Number(n).toLocaleString('pt-BR'):'Sob consulta';
const S={user:null,profile:null,cfg:{},veh:[],f:{},tab:'veiculos',edit:null,pr:[],page:'inicio'};
const isAdmin=()=>!!S.user&&S.profile?.role==='admin'&&S.profile?.active===true;
const photos=v=>(v.vehicle_photos||[]).slice().sort((a,b)=>(b.is_main-a.is_main)||(a.display_order-b.display_order));
const cover=v=>photos(v)[0]?.image_url;

function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',4500)}

/* ---------- dados ---------- */
async function loadCfg(){const{data}=await sb.from('settings').select('*');S.cfg=Object.fromEntries((data||[]).map(r=>[r.key,r.value]))}
async function loadVeh(){
  let q=sb.from('vehicles').select('*,vehicle_photos(*)').order('created_at',{ascending:false});
  if(!isAdmin())q=q.eq('status','publicado');
  const{data,error}=await q;if(error)toast('Erro ao carregar veículos: '+error.message,1);S.veh=data||[]}
async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();S.profile=data}

/* ---------- layout ---------- */
const mark=()=>`<img src="${esc(S.cfg.logo_url||'fotos/logo.png')}" alt="VANTA MOTORS" onerror="this.outerHTML='&lt;span class=vmark&gt;V&lt;/span&gt;'">`:
function header(){
  const p=S.page,a=(h,t)=>`<a href="#${h}" class="${p===h?'on':''}">${t}</a>`;
  $('#hdr').innerHTML=`<header><div class="w bar"><a class="logo" href="#inicio" title="Voltar ao início">${mark()}<span><b>VANTA</b><small>MOTORS</small></span></a>
  <nav>${a('inicio','Início')}${a('catalogo','Catálogo')}${a('contato','Contato')}${isAdmin()?a('admin','Painel')+'<button class="btn dark" onclick="logout()">Sair</button>':a('login','Entrar')}</nav></div></header>`}
function footer(){
  $('#ftr').innerHTML=`<div class="w"><div><b style="color:#fff;font-family:Montserrat">${esc(S.cfg.nome_empresa||'VANTA MOTORS')}</b><br>${esc(S.cfg.endereco||'')}</div>
  <div><a href="#inicio">Início</a><a href="#catalogo">Catálogo</a><a href="#contato">Contato</a>${S.cfg.instagram?`<a href="${esc(S.cfg.instagram)}" target="_blank" rel="noopener">Instagram</a>`:''}</div>
  <div>© ${new Date().getFullYear()} VANTA MOTORS. Todos os direitos reservados.</div></div>`}

/* ---------- roteador ---------- */
async function route(){
  const h=location.hash.slice(1)||'inicio';
  if(h==='home'){location.hash='inicio';return}
  const[p,id]=h.split(':');S.page=p;
  const views={inicio,catalogo,contato,login,veiculo:()=>detail(id),admin};
  header();
  $('#app').innerHTML=await (views[p]||inicio)();
  footer();scrollTo(0,0);
  if(p==='catalogo')grid();
}

/* ---------- páginas públicas ---------- */
const card=v=>`<div class="card"><div class="ph">${cover(v)?`<img src="${esc(cover(v))}" alt="${esc(v.marca)} ${esc(v.modelo)}" loading="lazy">`:'ÁREA PARA FOTO'}</div>
<div class="pad"><h3>${esc(v.marca)} ${esc(v.modelo)}</h3><p class="mut">${esc(v.versao||'Versão não informada')} • ${esc(v.ano_modelo||v.ano_fab||'—')} • ${v.km!=null?esc(v.km)+' km':'km não informado'}</p>
<div class="row" style="margin-top:14px"><b>${brl(v.preco)}</b><a class="btn gold" href="#veiculo:${esc(v.id)}">Ver detalhes</a></div></div></div>`;

function inicio(){
  const pub=S.veh.filter(v=>v.status==='publicado');
  return `<div class="w"><section class="hero"><div><h1>Seu próximo<br>carro começa<br><span>aqui.</span></h1>
  <div class="search"><input id="hq" placeholder="Buscar marca, modelo, versão..." onkeydown="if(event.key==='Enter')goSearch()"><button class="btn gold" onclick="goSearch()">Buscar agora</button></div>
  <div class="chips"><button class="btn" onclick="S.f={tipo:'Carro'};location.hash='catalogo'">Carros</button><button class="btn" onclick="S.f={tipo:'Moto'};location.hash='catalogo'">Motos</button><span class="mut" style="align-self:center">${pub.length} publicados</span></div></div>
  <div class="card ph" style="margin:0;aspect-ratio:4/3;border-radius:24px">${pub[0]&&cover(pub[0])?`<img src="${esc(cover(pub[0]))}" alt="Destaque">`:'ÁREA PARA FOTO'}</div></section>
  <div class="row" style="margin-bottom:16px"><h2>Veículos em destaque</h2><a class="btn" href="#catalogo">Ver catálogo completo</a></div>
  ${pub.length?`<div class="grid">${pub.slice(0,6).map(card).join('')}</div>`:`<div class="card empty"><h2>${EMPTY}</h2></div>`}</div>`}
function goSearch(){S.f={q:$('#hq').value.trim()};location.hash='catalogo'}

function catalogo(){
  const u=k=>[...new Set(S.veh.map(v=>v[k]).filter(Boolean))].sort();
  const sel=(k,l)=>`<label>${l}</label><select onchange="S.f.${k}=this.value;grid()"><option value="">Todos</option>${u(k).map(o=>`<option ${S.f[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  return `<div class="w cat"><aside class="card pad"><h3>Filtros</h3><label>Busca</label><input value="${esc(S.f.q||'')}" oninput="S.f.q=this.value;grid()" placeholder="Marca, modelo...">
  ${sel('tipo','Tipo')}${sel('marca','Marca')}${sel('modelo','Modelo')}${sel('categoria','Categoria')}${sel('cidade','Cidade')}
  <div class="two"><div><label>Preço mín.</label><input type="number" value="${esc(S.f.min||'')}" oninput="S.f.min=this.value;grid()"></div><div><label>Preço máx.</label><input type="number" value="${esc(S.f.max||'')}" oninput="S.f.max=this.value;grid()"></div></div>
  <button class="btn" style="margin-top:16px;width:100%" onclick="S.f={};route()">Limpar filtros</button></aside>
  <section><div class="row" style="margin-bottom:16px"><h1>Catálogo</h1><span id="cnt" class="mut"></span></div><div id="grid" class="grid"></div></section></div>`}
function grid(){
  const f=S.f,q=(f.q||'').toLowerCase();
  const r=S.veh.filter(v=>(!q||[v.marca,v.modelo,v.versao,v.categoria].join(' ').toLowerCase().includes(q))
    &&['tipo','marca','modelo','categoria','cidade'].every(k=>!f[k]||v[k]===f[k])
    &&(!f.min||+v.preco>=+f.min)&&(!f.max||+v.preco<=+f.max));
  $('#grid').innerHTML=r.length?r.map(card).join(''):`<div class="card empty" style="grid-column:1/-1"><h3>${EMPTY}</h3><p class="mut">Se aplicou filtros, tente limpá-los.</p></div>`;
  $('#cnt').textContent=r.length+' veículo(s)'}

function detail(id){
  const v=S.veh.find(x=>x.id===id);
  if(!v)return `<div class="w"><div class="card empty"><h2>Veículo não encontrado.</h2><br><a class="btn dark" href="#catalogo">Voltar ao catálogo</a></div></div>`;
  const ph=photos(v),wa=(S.cfg.whatsapp||'').replace(/\D/g,'');
  const rows=[['Marca',v.marca],['Modelo',v.modelo],['Versão',v.versao],['Tipo',v.tipo],['Condição',v.condicao],['Categoria',v.categoria],['Ano fab./modelo',(v.ano_fab||v.ano_modelo)&&`${v.ano_fab||'—'} / ${v.ano_modelo||'—'}`],['KM',v.km!=null&&v.km+' km'],['Combustível',v.combustivel],['Câmbio',v.cambio],['Cor',v.cor],['Portas',v.portas],['Motor',v.motor],['Cidade',v.cidade&&`${v.cidade}${v.estado?' - '+v.estado:''}`]].filter(r=>r[1]);
  return `<div class="w"><a class="btn" href="#catalogo">← Voltar ao catálogo</a><div class="det"><div>
  <div class="card"><div class="ph big">${ph[0]?`<img id="mainimg" src="${esc(ph[0].image_url)}" alt="">`:'ÁREA PARA FOTO'}</div>${ph.length>1?`<div class="thumbs">${ph.map(p=>`<img src="${esc(p.image_url)}" alt="" onclick="$('#mainimg').src=this.src">`).join('')}</div>`:''}</div>
  <div class="card pad"><h3>Ficha técnica</h3>${rows.map(([k,x])=>`<div class="spec"><span class="mut">${k}</span><b>${esc(x)}</b></div>`).join('')}
  ${v.descricao?`<h3 style="margin-top:20px">Descrição</h3><p style="white-space:pre-wrap">${esc(v.descricao)}</p>`:''}
  ${v.opcionais?.length?`<h3 style="margin-top:20px">Opcionais</h3>${v.opcionais.map(o=>`<span class="tag">${esc(o)}</span>`).join('')}`:''}</div></div>
  <div><div class="card pad"><h2>${esc(v.marca)} ${esc(v.modelo)}</h2><p class="mut">${esc(v.versao||'')}</p><div class="price">${brl(v.preco)}</div>
  ${v.status==='reservado'?'<span class="tag">Reservado</span>':''}
  <button class="btn gold" style="width:100%;margin-top:8px" onclick="$('#ln').focus();$('#lm').value='Tenho interesse no ${esc(v.marca)} ${esc(v.modelo)}.'">Tenho interesse</button>
  ${wa?`<a class="btn" style="width:100%;text-align:center;margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Olá, tenho interesse no '+v.marca+' '+v.modelo)}">Falar no WhatsApp</a>`:''}</div>
  <div class="card pad"><h3>Enviar interesse</h3>${leadForm(v.id)}</div></div></div></div>`}

function leadForm(vid){
  return `<label>Nome completo *</label><input id="ln" autocomplete="name"><label>WhatsApp *</label><input id="lw" inputmode="tel" placeholder="DDD + número" autocomplete="tel">
  <label>E-mail (opcional)</label><input id="le" type="email" autocomplete="email"><label>Mensagem</label><textarea id="lm" rows="3"></textarea>
  <label class="chk"><input type="checkbox" id="lc">Concordo com o tratamento dos meus dados para retorno de contato, conforme a LGPD.</label>
  <button class="btn gold" id="lb" style="width:100%" onclick="sendLead(${vid?`'${esc(vid)}'`:'null'})">Enviar mensagem</button>`}
function contato(){return `<div class="w" style="max-width:720px"><h1>Entre em contato</h1><p class="mut" style="margin:8px 0 24px">Responderemos pelo WhatsApp informado.</p><div class="card pad">${leadForm(null)}</div></div>`}

async function emailjs(p){
  const c=S.cfg;if(!c.emailjs_service||!c.emailjs_template||!c.emailjs_key)return false;
  try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:c.emailjs_service,template_id:c.emailjs_template,user_id:c.emailjs_key,template_params:{...p,to_email:c.email_contato||MAIL_PADRAO}})});return r.ok}catch{return false}}

async function sendLead(vid){
  const g=i=>$('#'+i).value.trim();
  const d={nome:g('ln'),whatsapp:g('lw'),email:g('le')||null,mensagem:g('lm')||null,vehicle_id:vid,origem:vid?'pagina_veiculo':'contato',consent_lgpd:$('#lc').checked};
  if(!d.nome||!d.whatsapp)return toast('Nome e WhatsApp são obrigatórios.',1);
  if(!d.consent_lgpd)return toast('Marque o consentimento LGPD para enviar.',1);
  const b=$('#lb');b.disabled=true;
  const{error}=await sb.from('leads').insert(d);
  if(error){b.disabled=false;return toast('Não foi possível enviar: '+error.message,1)}
  const v=S.veh.find(x=>x.id===vid);
  const p={nome:d.nome,whatsapp:d.whatsapp,email:d.email||'',mensagem:d.mensagem||'',veiculo:v?`${v.marca} ${v.modelo} (${v.id})`:'',enviado_em:new Date().toLocaleString('pt-BR')};
  let ok=false;
  try{const r=await sb.functions.invoke('send-contact',{body:p});ok=!r.error}catch{}
  if(!ok)ok=await emailjs(p);
  b.disabled=false;
  if(ok){toast('Mensagem enviada! Retornaremos em breve no seu WhatsApp.');['ln','lw','le','lm'].forEach(i=>$('#'+i).value='');$('#lc').checked=false}
  else toast('Recebemos seu contato, mas o e-mail não pôde ser enviado agora. Fale conosco pelo WhatsApp.',1)}

/* ---------- login ---------- */
function login(){
  if(isAdmin()){location.hash='admin';return ''}
  return `<div class="w" style="max-width:480px"><div class="card pad"><div class="vmark" style="margin-bottom:16px">V</div><h2>Acesso administrativo</h2>
  <label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn dark" style="width:100%;margin-top:18px" onclick="doLogin()">Entrar</button></div></div>`}
async function doLogin(){
  const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)return toast('E-mail ou senha inválidos.',1);
  S.user=data.user;await loadProfile();
  if(!isAdmin()){await sb.auth.signOut();S.user=S.profile=null;return toast('Esta conta não tem acesso administrativo.',1)}
  await loadVeh();toast('Login realizado.');location.hash='admin';route()}
async function logout(){await sb.auth.signOut();S.user=S.profile=null;S.edit=null;await loadVeh();location.hash='inicio';route()}

/* ---------- painel admin ---------- */
const VF=[['tipo','Tipo'],['condicao','Condição'],['marca','Marca *'],['modelo','Modelo *'],['versao','Versão'],['categoria','Categoria'],['ano_fab','Ano fab.','number'],['ano_modelo','Ano modelo','number'],['km','KM','number'],['preco','Preço','number'],['combustivel','Combustível'],['cambio','Câmbio'],['cor','Cor'],['portas','Portas','number'],['motor','Motor'],['cidade','Cidade'],['estado','UF'],['anunciante_nome','Anunciante'],['anunciante_phone','Telefone do anunciante'],['link_original','Link original']];
const PF=[['nome','Nome'],['tipo','Tipo'],['contato','Contato'],['cidade','Cidade'],['observacoes','Observações']];
const XF=[['link','Link'],['marca','Marca'],['modelo','Modelo'],['ano','Ano'],['preco','Preço'],['anunciante','Anunciante'],['contato','Contato'],['cidade','Cidade'],['observacoes','Observações']];
const FS={partners:PF,prospect_listings:XF},PS=['Novo','Contatado','Aguardando','Autorizado','Convertido','Descartado'];
const CF=[['nome_empresa','Nome da empresa'],['email_contato','E-mail que recebe os contatos'],['whatsapp','WhatsApp oficial (DDD + número)'],['instagram','Instagram (URL)'],['endereco','Endereço'],['emailjs_service','EmailJS service_id (fallback)'],['emailjs_template','EmailJS template_id'],['emailjs_key','EmailJS public key']];

async function admin(){
  if(!isAdmin())return `<div class="w"><div class="card empty"><h2>Acesso restrito</h2><p class="mut" style="margin:8px 0 16px">Entre com uma conta administrativa.</p><a class="btn dark" href="#login">Ir para o login</a></div></div>`;
  await loadVeh();
  const tabs=[['veiculos','Veículos'],['leads','Interessados'],['parceiros','Parceiros'],['prospeccao','Prospecção'],['config','Configurações']];
  const body=await({veiculos:tVeh,leads:tLeads,parceiros:()=>tCrud('partners'),prospeccao:()=>tCrud('prospect_listings'),config:tCfg}[S.tab]||tVeh)();
  return `<div class="w"><div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${S.tab===k?'dark':''}" onclick="S.tab='${k}';S.edit=null;route()">${l}</button>`).join('')}</div>${body}</div>`}

function tVeh(){
  const c=s=>S.veh.filter(v=>v.status===s).length;
  const list=S.veh.map(v=>`<div class="row item"><div><b>${esc(v.marca)} ${esc(v.modelo)}</b> <span class="mut">• ${esc(v.status)} • ${brl(v.preco)} • ${(v.vehicle_photos||[]).length} foto(s)</span></div>
  <div><select class="sm" onchange="setStatus('${v.id}',this.value)">${ST.map(s=>`<option ${v.status===s?'selected':''}>${s}</option>`).join('')}</select>
  <button class="btn" onclick="editV('${v.id}')">Editar</button> <button class="btn dark" onclick="delV('${v.id}')">Excluir</button></div></div>`).join('')||'<p class="mut">Nenhum veículo cadastrado. Clique em “Adicionar veículo”.</p>';
  return `<div class="row" style="margin-bottom:16px"><div><h2>Veículos</h2><span class="mut">${S.veh.length} no total • ${c('publicado')} publicados • ${c('rascunho')} rascunhos • ${c('reservado')} reservados • ${c('vendido')} vendidos</span></div><button class="btn gold" onclick="S.edit={};route()">+ Adicionar veículo</button></div>
  <div class="card pad">${list}</div>${S.edit?form(S.edit):''}`}

const form=e=>`<div class="card pad" id="vf"><h2>${e.id?'Editar':'Novo'} veículo</h2><p class="mut">Todos os campos são texto livre; só marca e modelo são obrigatórios.</p>
<div class="fg">${VF.map(([k,l,t])=>`<div><label>${l}</label><input id="v_${k}" type="${t||'text'}" value="${esc(e[k]??(k==='tipo'?'Carro':k==='condicao'?'Usado':''))}"></div>`).join('')}</div>
<label>Descrição</label><textarea id="v_descricao" rows="4">${esc(e.descricao)}</textarea>
<label>Opcionais (separe por vírgula)</label><input id="v_opcionais" value="${esc((e.opcionais||[]).join(', '))}">
<label>Observações internas (não públicas)</label><textarea id="v_observacoes_internas" rows="2">${esc(e.observacoes_internas)}</textarea>
<label>Status</label><select id="v_status">${ST.map(s=>`<option ${(e.status||'rascunho')===s?'selected':''}>${s}</option>`).join('')}</select>
<label>Fotos (JPG, PNG ou WebP, máx. 5 MB cada)</label><input type="file" id="v_files" multiple accept="image/jpeg,image/png,image/webp">
${e.id?`<div class="thumbs">${photos(e).map(p=>`<span class="pt"><img src="${esc(p.image_url)}" alt=""><button title="Foto principal" onclick="mainP('${p.id}','${e.id}')">${p.is_main?'★':'☆'}</button><button title="Remover" onclick="delP('${p.id}','${e.id}')">×</button></span>`).join('')}</div>`:''}
<div style="margin-top:18px"><button class="btn gold" onclick="saveV()">Salvar veículo</button> <button class="btn" onclick="S.edit=null;route()">Cancelar</button></div></div>`;

async function editV(id){S.edit=S.veh.find(v=>v.id===id);await route();$('#vf')?.scrollIntoView()}
async function refreshEdit(id){await loadVeh();S.edit=S.veh.find(v=>v.id===id);await route();$('#vf')?.scrollIntoView()}
async function saveV(){
  const e=S.edit,o={};
  for(const[k,,t]of VF){const x=$('#v_'+k).value.trim();o[k]=t==='number'?(x===''?null:+x):(x||null)}
  o.descricao=$('#v_descricao').value.trim()||null;o.observacoes_internas=$('#v_observacoes_internas').value.trim()||null;
  o.opcionais=$('#v_opcionais').value.split(',').map(s=>s.trim()).filter(Boolean);o.status=$('#v_status').value;o.updated_at=new Date().toISOString();
  if(!o.marca||!o.modelo)return toast('Marca e modelo são obrigatórios.',1);
  if(!o.tipo)return toast('Informe o tipo (ex.: Carro, Moto).',1);
  const files=[...$('#v_files').files];
  if(files.some(f=>f.size>5*1024*1024))return toast('Cada foto deve ter no máximo 5 MB.',1);
  let id=e.id,r;
  if(id)r=await sb.from('vehicles').update(o).eq('id',id);
  else{o.responsavel_id=S.user.id;r=await sb.from('vehicles').insert(o).select('id').single();id=r.data?.id}
  if(r.error)return toast('Erro ao salvar: '+r.error.message,1);
  const has=(e.vehicle_photos||[]).length;
  for(const[i,f]of files.entries()){
    const path=`${id}/${Date.now()}-${i}-${f.name.replace(/[^\w.-]/g,'_')}`;
    const u=await sb.storage.from('vehicle-images').upload(path,f);
    if(u.error){toast('Falha no upload de '+f.name+': '+u.error.message,1);continue}
    const url=sb.storage.from('vehicle-images').getPublicUrl(path).data.publicUrl;
    await sb.from('vehicle_photos').insert({vehicle_id:id,image_url:url,display_order:has+i,is_main:!has&&i===0})}
  S.edit=null;toast('Veículo salvo.');route()}
async function setStatus(id,s){const{error}=await sb.from('vehicles').update({status:s,updated_at:new Date().toISOString()}).eq('id',id);toast(error?error.message:'Status: '+s,!!error);route()}
async function delV(id){if(!confirm('Excluir permanentemente? Esta ação não pode ser desfeita.'))return;const{error}=await sb.from('vehicles').delete().eq('id',id);toast(error?error.message:'Veículo excluído.',!!error);route()}
async function mainP(p,v){await sb.from('vehicle_photos').update({is_main:false}).eq('vehicle_id',v);await sb.from('vehicle_photos').update({is_main:true}).eq('id',p);refreshEdit(v)}
async function delP(p,v){
  const ph=S.edit.vehicle_photos.find(x=>x.id===p),path=ph?.image_url.split('/vehicle-images/')[1];
  if(path)await sb.storage.from('vehicle-images').remove([decodeURIComponent(path)]);
  await sb.from('vehicle_photos').delete().eq('id',p);refreshEdit(v)}

async function tLeads(){
  const{data}=await sb.from('leads').select('*').order('created_at',{ascending:false});
  const stages=['Novo','Primeiro contato','Negociação','Visita','Convertido','Perdido'];
  return `<h2 style="margin-bottom:16px">Interessados</h2><div class="card pad">${(data||[]).map(l=>`<div class="item"><div class="row"><b>${esc(l.nome)} • ${esc(l.whatsapp)}</b>
  <select class="sm" onchange="setStage('${l.id}',this.value)">${stages.map(s=>`<option ${l.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>
  <p class="mut">${esc(l.email||'')} ${esc(l.mensagem||'')} • ${new Date(l.created_at).toLocaleString('pt-BR')}${l.vehicle_id?' • veículo '+esc(l.vehicle_id.slice(0,8)):''}</p></div>`).join('')||'<p class="mut">Nenhum contato recebido.</p>'}</div>`}
async function setStage(id,s){const{error}=await sb.from('leads').update({stage:s}).eq('id',id);toast(error?error.message:'Etapa atualizada.',!!error)}

async function tCrud(t){
  const F=FS[t],pr=t==='prospect_listings';
  const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});S.pr=data||[];
  return `<h2 style="margin-bottom:16px">${pr?'Prospecção manual':'Parceiros'}</h2><div class="card pad"><div class="fg">${F.map(([k,l])=>`<div><label>${l}</label><input id="c_${k}"></div>`).join('')}</div><button class="btn gold" style="margin-top:14px" onclick="addC('${t}')">Adicionar</button></div>
  <div class="card pad">${S.pr.map(r=>`<div class="row item"><span>${F.map(([k])=>esc(r[k]??'')).filter(Boolean).join(' • ')}</span><span>
  ${pr?`<select class="sm" onchange="updC('${r.id}',this.value)">${PS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select> <button class="btn dark" onclick="convP('${r.id}')">Converter em anúncio</button> `:''}
  <button class="btn" onclick="delC('${t}','${r.id}')">Excluir</button></span></div>`).join('')||'<p class="mut">Nada cadastrado.</p>'}</div>`}
async function addC(t){
  const o={};for(const[k]of FS[t]){const x=$('#c_'+k).value.trim();o[k]=['ano','preco'].includes(k)?(x===''?null:+x):(x||null)}
  if(!Object.values(o).some(Boolean))return toast('Preencha ao menos um campo.',1);
  const{error}=await sb.from(t).insert(o);toast(error?error.message:'Adicionado.',!!error);route()}
async function updC(id,s){const{error}=await sb.from('prospect_listings').update({status:s}).eq('id',id);toast(error?error.message:'Status atualizado.',!!error)}
async function delC(t,id){if(!confirm('Excluir este registro?'))return;await sb.from(t).delete().eq('id',id);route()}
function convP(id){
  const r=S.pr.find(x=>x.id===id);
  S.edit={marca:r.marca,modelo:r.modelo,ano_fab:r.ano,ano_modelo:r.ano,preco:r.preco,cidade:r.cidade,anunciante_nome:r.anunciante,anunciante_phone:r.contato,link_original:r.link,observacoes_internas:r.observacoes};
  S.tab='veiculos';route()}

function tCfg(){
  return `<h2 style="margin-bottom:16px">Configurações</h2><div class="card pad"><h3>Logo</h3><div class="row"><span class="logo" style="pointer-events:none">${mark()}</span><input type="file" id="logo" accept="image/png,image/webp,image/jpeg" style="max-width:320px"></div>
  <p class="mut" style="margin-top:8px">PNG com fundo transparente, até 2 MB. Também vale colocar o arquivo em fotos/logo.png.</p><button class="btn gold" style="margin-top:12px" onclick="saveLogo()">Enviar logo</button></div>
  <div class="card pad"><div class="fg">${CF.map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" value="${esc(S.cfg[k]||(k==='email_contato'?MAIL_PADRAO:''))}"></div>`).join('')}</div>
  <button class="btn gold" style="margin-top:14px" onclick="saveCfg()">Salvar configurações</button></div>`}
async function saveCfg(){
  const rows=CF.map(([k])=>({key:k,value:$('#s_'+k).value.trim(),updated_at:new Date().toISOString()}));
  const{error}=await sb.from('settings').upsert(rows);if(!error)await loadCfg();
  toast(error?error.message:'Configurações salvas.',!!error);route()}
async function saveLogo(){
  const f=$('#logo').files[0];if(!f)return toast('Escolha um arquivo.',1);if(f.size>2*1024*1024)return toast('A logo deve ter no máximo 2 MB.',1);
  const path='branding/logo-'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
  const u=await sb.storage.from('vehicle-images').upload(path,f);if(u.error)return toast(u.error.message,1);
  const url=sb.storage.from('vehicle-images').getPublicUrl(path).data.publicUrl;
  const{error}=await sb.from('settings').upsert({key:'logo_url',value:url});if(!error)S.cfg.logo_url=url;
  toast(error?error.message:'Logo atualizada.',!!error);route()}

/* ---------- início ---------- */
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;if(S.user)await loadProfile();
  await Promise.all([loadCfg(),loadVeh()]);
  addEventListener('hashchange',route);route()})();
// JS END
</script>
</body>
</html>
